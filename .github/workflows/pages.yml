name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允許讀 repo、寫 Pages，並取得部署用的 OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；排隊中的舊的可以取消，但不打斷進行中的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement 會在 Pages 還沒開的時候幫忙打開
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 站台就是根目錄的 index.html，沒有建置步驟
      # 這個 action 預設會排除 .git 和 .github
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
